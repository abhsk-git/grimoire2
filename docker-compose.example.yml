services:
  mariadb:
    image: mariadb:11
    container_name: grimoire-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change_me_root_password
      MYSQL_DATABASE: grimoire
      MYSQL_USER: grimoire_user
      MYSQL_PASSWORD: change_me_database_password
    command: --max_allowed_packet=64M
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: ./api
    container_name: grimoire-backend
    restart: unless-stopped
    env_file:
      - ./api/config/.env
    depends_on:
      - mariadb
    ports:
      - "127.0.0.1:5051:5051"

  frontend2:
    profiles: ["frontend2"]
    build:
      context: .
      dockerfile: frontend2/Dockerfile
    container_name: grimoire-frontend2
    restart: "no"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: grimoire-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mariadb_data:
